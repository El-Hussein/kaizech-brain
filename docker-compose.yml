services:
  # PostgreSQL with pgvector
  postgres:
    image: pgvector/pgvector:pg16
    container_name: kaizech-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: kaizech
      POSTGRES_PASSWORD: kaizech_secret_2024
      POSTGRES_DB: kaizech_brain
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kaizech -d kaizech_brain']
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis
  redis:
    image: redis:7-alpine
    container_name: kaizech-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API Server
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: kaizech-api
    restart: unless-stopped
    ports:
      - '3000:3000'
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: kaizech
      DB_PASSWORD: kaizech_secret_2024
      DB_DATABASE: kaizech_brain
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Tenant Customer Dashboard
  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
    container_name: kaizech-dashboard
    restart: unless-stopped
    ports:
      - '5173:80'
    depends_on:
      - api

  # Platform Super Admin Dashboard
  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    container_name: kaizech-admin
    restart: unless-stopped
    ports:
      - '5174:80'
    depends_on:
      - api

  # Landing Page
  landing:
    build:
      context: .
      dockerfile: apps/landing/Dockerfile
    container_name: kaizech-landing
    restart: unless-stopped
    ports:
      - '3001:3000'
    depends_on:
      - api

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
